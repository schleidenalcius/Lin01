<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS101 semaine-14 — Créer des éléments HTML</title>
</head>
<body>
  <h1>JS101 sem-14 — Créer des éléments HTML</h1>


  <script>
    let animaux = [
      {type: "Chat", couleur: "noir"},
      {type: "Chien", couleur: "brun"},
      {type: "Lapin", couleur: "rose"}
    ];

    const mesAnimaux = document.createElement("ul");
    document.body.appendChild(mesAnimaux);
    animaux.forEach(animal =>{
      let monAnimal = document.createElement("li");
      monAnimal.textContent = `Je suis un ${animal.type} de couleur ${animal.couleur}`;
      mesAnimaux.appendChild(monAnimal);
    });
