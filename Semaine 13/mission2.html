<!DOCTYPE html>
<html lang="fr-CA">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission 1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="boitier">
        <h1>n = 10</h1>
        <p id="action_nombre">n++ , n-- ou n=0</p>
        <div class="boutons">
            <button id="moins">-</button>
            <button id="reset">0</button>
            <button id="plus">+</button>
        </div>
    </div>
    <div class="deuxiemeRange">
        <div class="tableau">
            <div class="palette">
                <button id="brun"></button>
                <button id="jaune"></button>
                <button id="vert"></button>
            </div>
        </div>
        
        <div class="formulaire">
            <input type="text" id="nom" name="nom" placeholder="Rentrer vos informations">
            <p id="message"></p>
            <div class="btnFormulaire">
                <button id="valider">valider</button>
                <button id="effacer">effacer</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
